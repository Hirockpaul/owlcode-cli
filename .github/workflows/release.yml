name: Release CLI to S3

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Validate release configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in AWS_REGION S3_BUCKET GPG_KEY_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret or variable is not configured: ${name}"
              exit 1
            fi
          done

      - name: Validate tag version
        run: |
          set -euo pipefail
          package_version="$(bun -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}"
            exit 1
          fi

      - name: Install dependencies for all release targets
        # Prisma loads datasource configuration during client generation, but
        # `prisma generate` does not connect to this build-only database URL.
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: bun install --frozen-lockfile --os="*" --cpu="*"

      - name: Build and verify standalone executables
        run: bun run release:build

      - name: Generate SHA-256 release manifest
        run: bun run release:manifest

      - name: Import signing key and sign manifest
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          passphrase_file="$(mktemp)"
          trap 'rm -f -- "$key_file" "$passphrase_file"' EXIT
          chmod 600 "$key_file" "$passphrase_file"
          printf '%s' "$GPG_PRIVATE_KEY" > "$key_file"
          printf '%s' "$GPG_PASSPHRASE" > "$passphrase_file"
          gpg --batch --import "$key_file"

          expected_fingerprint="$(printf '%s' "$GPG_KEY_ID" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if ! gpg --batch --with-colons --list-secret-keys "$expected_fingerprint" | \
            awk -F: -v expected="$expected_fingerprint" \
              '$1 == "fpr" && toupper($10) == expected { found = 1 } END { exit !found }'; then
            echo "::error::Imported private key does not contain the configured GPG_KEY_ID fingerprint"
            exit 1
          fi

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --armor \
            --local-user "$expected_fingerprint" \
            --detach-sign \
            --output dist/release-manifest.json.asc \
            dist/release-manifest.json
          gpg --batch --verify \
            dist/release-manifest.json.asc \
            dist/release-manifest.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload immutable release
        run: |
          set -euo pipefail
          prefix="releases/${GITHUB_REF_NAME}/"
          version="${GITHUB_REF_NAME#v}"
          files=(
            "dist/owlcode_${version}_linux_x64.tar.gz"
            "dist/owlcode_${version}_linux_arm64.tar.gz"
            "dist/owlcode_${version}_windows_x64.zip"
            "dist/owlcode_${version}_macos_x64.tar.gz"
            "dist/owlcode_${version}_macos_arm64.tar.gz"
            dist/release-manifest.json
            dist/release-manifest.json.asc
          )
          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Expected release artifact is missing or empty: ${file}"
              exit 1
            fi
          done

          expected_keys=()
          for file in "${files[@]}"; do
            expected_keys+=("${prefix}$(basename "$file")")
          done

          mapfile -t existing_keys < <(
            aws s3api list-objects-v2 \
              --bucket "$S3_BUCKET" \
              --prefix "$prefix" \
              --query 'Contents[].Key' \
              --output text | tr '\t' '\n' | sed '/^None$/d; /^$/d'
          )
          if [ "${#existing_keys[@]}" -ne 0 ]; then
            matched=0
            for key in "${existing_keys[@]}"; do
              is_expected=false
              for expected_key in "${expected_keys[@]}"; do
                if [ "$key" = "$expected_key" ]; then
                  is_expected=true
                  matched=$((matched + 1))
                  break
                fi
              done
              if [ "$is_expected" = false ]; then
                echo "::error::Refusing to modify release prefix containing unexpected object: s3://${S3_BUCKET}/${key}"
                exit 1
              fi
            done

            if [ "$matched" -eq "${#expected_keys[@]}" ]; then
              echo "::error::Refusing to overwrite complete release s3://${S3_BUCKET}/${prefix}"
              exit 1
            fi

            echo "Recovering partial release s3://${S3_BUCKET}/${prefix} (${matched}/${#expected_keys[@]} expected objects present)"
            for key in "${existing_keys[@]}"; do
              aws s3api delete-object --bucket "$S3_BUCKET" --key "$key"
            done
          fi

          for file in "${files[@]}"; do
            aws s3 cp "$file" "s3://${S3_BUCKET}/${prefix}$(basename "$file")" --only-show-errors
          done

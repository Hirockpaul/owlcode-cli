name: Release CLI to S3

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild (for example, v1.0.0)
        required: true
        type: string
      force:
        description: Delete and replace the exact existing release prefix
        required: true
        default: false
        type: boolean
      confirm_release_tag:
        description: Retype the release tag when force is enabled
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    env:
      AWS_REGION: ap-south-1
      S3_BUCKET: owlcode-cli-releases-441870953577-ap-south-1-an
      GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
      OWLCODE_PUBLIC_API_URL: ${{ vars.OWLCODE_PUBLIC_API_URL }}
      CLERK_FRONTEND_API: ${{ vars.CLERK_FRONTEND_API }}
      CLERK_OAUTH_CLIENT_ID: ${{ vars.CLERK_OAUTH_CLIENT_ID }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      # Always serialize the boolean dispatch input as the literal strings the
      # shell guard expects. Tag-push releases can never replace a prefix.
      FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
      CONFIRM_RELEASE_TAG: ${{ inputs.confirm_release_tag || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Validate release configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in AWS_REGION S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GPG_KEY_ID GPG_PRIVATE_KEY GPG_PASSPHRASE OWLCODE_PUBLIC_API_URL CLERK_FRONTEND_API CLERK_OAUTH_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret or variable is not configured: ${name}"
              exit 1
            fi
          done

      - name: Validate tag version
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "::error::Invalid release tag: ${RELEASE_TAG}"
            exit 1
          fi
          if ! git tag --points-at HEAD --list "$RELEASE_TAG" | grep -Fxq "$RELEASE_TAG"; then
            echo "::error::Checked-out commit is not tagged ${RELEASE_TAG}"
            exit 1
          fi
          package_version="$(bun -p 'require("./package.json").version')"
          if [ "$RELEASE_TAG" != "v${package_version}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version ${package_version}"
            exit 1
          fi
          if [ "$FORCE_RELEASE" = "true" ] && [ "$CONFIRM_RELEASE_TAG" != "$RELEASE_TAG" ]; then
            echo "::error::Force release requires confirm_release_tag to exactly match ${RELEASE_TAG}"
            exit 1
          fi
          echo "Release overwrite mode: ${FORCE_RELEASE}"

      - name: Install dependencies for all release targets
        # Prisma loads datasource configuration during client generation, but
        # `prisma generate` does not connect to this build-only database URL.
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: bun install --frozen-lockfile --os="*" --cpu="*"

      - name: Build and verify standalone executables
        run: |
          set -euo pipefail
          bun run release:build

          staging_binary="dist/staging/bun-linux-x64/owlcode"
          archive="dist/owlcode_${RELEASE_TAG#v}_linux_x64.tar.gz"
          for forbidden_string in "CLERK_FRONTEND_API not set" "CLERK_SECRET_KEY"; do
            if strings "$staging_binary" | grep -Fq "$forbidden_string"; then
              echo "::error::Forbidden string found in Linux staging binary: $forbidden_string"
              exit 1
            fi
          done

          extracted_dir="$(mktemp -d)"
          trap 'rm -rf -- "$extracted_dir"' EXIT
          tar -xzf "$archive" -C "$extracted_dir"
          archive_binary="$extracted_dir/owlcode"
          if [ ! -x "$archive_binary" ]; then
            echo "::error::Linux release archive does not contain an executable owlcode binary"
            exit 1
          fi
          if [ "$("$archive_binary" --version)" != "OwlCode v${RELEASE_TAG#v}" ]; then
            echo "::error::Linux release archive binary version does not match ${RELEASE_TAG}"
            exit 1
          fi
          for forbidden_string in "CLERK_FRONTEND_API not set" "CLERK_SECRET_KEY"; do
            if strings "$archive_binary" | grep -Fq "$forbidden_string"; then
              echo "::error::Forbidden string found in Linux release archive: $forbidden_string"
              exit 1
            fi
          done

      - name: Build public CLI bootstrap configuration
        run: |
          set -euo pipefail
          case "$OWLCODE_PUBLIC_API_URL" in https://*) ;; *) echo "::error::OWLCODE_PUBLIC_API_URL must be an HTTPS URL"; exit 1 ;; esac
          case "$CLERK_FRONTEND_API" in https://*) ;; *) echo "::error::CLERK_FRONTEND_API must be an HTTPS URL"; exit 1 ;; esac
          python3 - <<'PY'
          import json, os
          config = {
              "apiUrl": os.environ["OWLCODE_PUBLIC_API_URL"].rstrip("/"),
              "clerk": {
                  "frontendApi": os.environ["CLERK_FRONTEND_API"].rstrip("/"),
                  "oauthClientId": os.environ["CLERK_OAUTH_CLIENT_ID"],
              },
          }
          with open("dist/owlcode-config.json", "w", encoding="utf-8") as output:
              json.dump(config, output, separators=(",", ":"))
              output.write("\n")
          PY

      - name: Generate SHA-256 release manifest
        run: bun run release:manifest

      - name: Import signing key and sign manifest
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          passphrase_file="$(mktemp)"
          trap 'rm -f -- "$key_file" "$passphrase_file"' EXIT
          chmod 600 "$key_file" "$passphrase_file"
          printf '%s' "$GPG_PRIVATE_KEY" > "$key_file"
          printf '%s' "$GPG_PASSPHRASE" > "$passphrase_file"
          gpg --batch --import "$key_file"

          expected_fingerprint="$(printf '%s' "$GPG_KEY_ID" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if ! gpg --batch --with-colons --list-secret-keys "$expected_fingerprint" | \
            awk -F: -v expected="$expected_fingerprint" \
              '$1 == "fpr" && toupper($10) == expected { found = 1 } END { exit !found }'; then
            echo "::error::Imported private key does not contain the configured GPG_KEY_ID fingerprint"
            exit 1
          fi

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --armor \
            --local-user "$expected_fingerprint" \
            --detach-sign \
            --output dist/release-manifest.json.asc \
            dist/release-manifest.json
          gpg --batch --verify \
            dist/release-manifest.json.asc \
            dist/release-manifest.json
          gpg --batch --armor --export "$expected_fingerprint" > dist/owlcode-signing-key.asc
          test -s dist/owlcode-signing-key.asc
          printf '%s\n' "${RELEASE_TAG#v}" > dist/version.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload immutable release
        run: |
          set -euo pipefail
          prefix="releases/${RELEASE_TAG}/"
          version="${RELEASE_TAG#v}"
          files=(
            "dist/owlcode_${version}_linux_x64.tar.gz"
            "dist/owlcode_${version}_linux_arm64.tar.gz"
            "dist/owlcode_${version}_windows_x64.zip"
            "dist/owlcode_${version}_macos_x64.tar.gz"
            "dist/owlcode_${version}_macos_arm64.tar.gz"
            dist/release-manifest.json
            dist/release-manifest.json.asc
          )
          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Expected release artifact is missing or empty: ${file}"
              exit 1
            fi
          done

          mapfile -t existing_keys < <(
            aws s3api list-objects-v2 \
              --bucket "$S3_BUCKET" \
              --prefix "$prefix" \
              --query 'Contents[].Key' \
              --output text | tr '\t' '\n' | sed '/^None$/d; /^$/d'
          )
          if [ "${#existing_keys[@]}" -ne 0 ]; then
            if [ "$FORCE_RELEASE" != "true" ]; then
              echo "::error::Refusing to overwrite existing release s3://${S3_BUCKET}/${prefix}. Re-run this workflow manually with force=true and confirm_release_tag=${RELEASE_TAG}."
              exit 1
            fi

            echo "Force release explicitly confirmed; replacing s3://${S3_BUCKET}/${prefix}"
            for key in "${existing_keys[@]}"; do
              aws s3api delete-object --bucket "$S3_BUCKET" --key "$key"
            done
          fi

          for file in "${files[@]}"; do
            aws s3 cp "$file" "s3://${S3_BUCKET}/${prefix}$(basename "$file")" --only-show-errors
          done

      - name: Verify immutable release upload
        run: |
          set -euo pipefail
          prefix="releases/${RELEASE_TAG}/"
          version="${RELEASE_TAG#v}"
          files=(
            "owlcode_${version}_linux_x64.tar.gz"
            "owlcode_${version}_linux_arm64.tar.gz"
            "owlcode_${version}_windows_x64.zip"
            "owlcode_${version}_macos_x64.tar.gz"
            "owlcode_${version}_macos_arm64.tar.gz"
            release-manifest.json
            release-manifest.json.asc
          )
          for file in "${files[@]}"; do
            aws s3api head-object --bucket "$S3_BUCKET" --key "${prefix}${file}" >/dev/null
          done

      - name: Upload current distribution files
        run: |
          set -euo pipefail
          files=(
            install.sh
            dist/owlcode-signing-key.asc
            dist/version.txt
            dist/owlcode-config.json
          )
          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Expected distribution file is missing or empty: ${file}"
              exit 1
            fi
          done

          # These current distribution objects are intentionally outside the
          # immutable version prefix. The installer accesses release content
          # directly from this public S3 bucket.
          aws s3 cp install.sh "s3://${S3_BUCKET}/install.sh" \
            --content-type text/plain --only-show-errors
          aws s3 cp dist/owlcode-signing-key.asc "s3://${S3_BUCKET}/owlcode-signing-key.asc" \
            --content-type application/pgp-keys --only-show-errors
          aws s3 cp dist/version.txt "s3://${S3_BUCKET}/version.txt" \
            --content-type text/plain --only-show-errors
          aws s3 cp dist/owlcode-config.json "s3://${S3_BUCKET}/owlcode-config.json" \
            --content-type application/json --cache-control 'public, max-age=300' --only-show-errors
